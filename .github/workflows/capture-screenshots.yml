name: Refresh README screenshots

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'tools/capture-screenshots.mjs'
      - '.github/workflows/capture-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture actual game screens
        run: node tools/capture-screenshots.mjs

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futuristic-call-of-shooty-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit screenshots to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "docs: refresh README gameplay screenshots"
          git push origin HEAD:main
