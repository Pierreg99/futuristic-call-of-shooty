<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#02050e"/>
  
  <text x="400" y="40" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="2">
    ❖ MOBILE TOUCH CONTROLS &amp; HUD ERGONOMICS
  </text>

  <!-- Device Frame Mockup -->
  <rect x="50" y="60" width="700" height="350" rx="16" fill="#060b17" stroke="#334155" stroke-width="2"/>

  <!-- Left: Virtual Joystick Zone -->
  <circle cx="150" cy="270" r="60" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="150" cy="270" r="24" fill="#0284c7" stroke="#22d3ee" stroke-width="2"/>
  <text x="150" y="360" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" text-anchor="middle">VIRTUAL THUMBSTICK</text>
  <text x="150" y="375" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(WASD KINETICS)</text>

  <!-- Center: Crosshair & Viewport -->
  <circle cx="400" cy="235" r="18" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="400" cy="235" r="2" fill="#22d3ee"/>
  <text x="400" y="275" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">DYNAMIC SPREAD RETICLE</text>

  <!-- Right: Touch Look Zone -->
  <rect x="360" y="80" width="370" height="180" rx="8" fill="rgba(34, 211, 238, 0.03)" stroke="rgba(34, 211, 238, 0.2)" stroke-dasharray="4 4"/>
  <text x="545" y="140" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">SWIPE TO AIM / LOOK</text>
  <text x="545" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">INERTIAL SWAY &amp; PITCH</text>

  <!-- Right Bottom: Action Button Cluster -->
  <!-- Jump -->
  <circle cx="560" cy="340" r="22" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="560" y="344" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">JUMP</text>

  <!-- ADS -->
  <circle cx="615" cy="300" r="22" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="615" y="304" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">ADS</text>

  <!-- Reload -->
  <circle cx="560" cy="280" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="284" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">RELOAD</text>

  <!-- Sprint -->
  <circle cx="505" cy="340" r="22" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="505" y="344" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#22d3ee" text-anchor="middle">SPRINT</text>

  <!-- FIRE Button (Prominent) -->
  <circle cx="680" cy="320" r="32" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="2.5"/>
  <text x="680" y="325" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">FIRE</text>
</svg>
