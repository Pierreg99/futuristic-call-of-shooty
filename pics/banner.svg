<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Tactical Grid -->
  <g stroke="rgba(34, 211, 238, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Hexagon Accent -->
  <polygon points="600,40 680,85 680,175 600,220 520,175 520,85" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.25"/>

  <!-- Crosshair Reticle -->
  <circle cx="600" cy="130" r="45" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="600" cy="130" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <line x1="600" y1="70" x2="600" y2="95" stroke="#22d3ee" stroke-width="2"/>
  <line x1="600" y1="165" x2="600" y2="190" stroke="#22d3ee" stroke-width="2"/>
  <line x1="540" y1="130" x2="565" y2="130" stroke="#22d3ee" stroke-width="2"/>
  <line x1="635" y1="130" x2="660" y2="130" stroke="#22d3ee" stroke-width="2"/>

  <!-- Main Title -->
  <text x="600" y="270" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="800" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="8" filter="url(#glow)">
    FUTURISTIC CALL OF SHOOTY
  </text>
  <text x="600" y="305" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="5">
    AAA THREE.JS WEBGL2 FPS ENGINE · CANNON-ES · SOBEL NORMAL PBR
  </text>

  <!-- Badges -->
  <rect x="250" y="340" width="160" height="28" rx="4" fill="rgba(34, 211, 238, 0.12)" stroke="#22d3ee" stroke-width="1"/>
  <text x="330" y="358" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" text-anchor="middle">60 FPS REALTIME</text>

  <rect x="430" y="340" width="160" height="28" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="358" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" text-anchor="middle">SPRING KINETICS</text>

  <rect x="610" y="340" width="160" height="28" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
  <text x="690" y="358" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" text-anchor="middle">AUDIT PASS (AAA)</text>

  <rect x="790" y="340" width="160" height="28" rx="4" fill="rgba(34, 211, 238, 0.12)" stroke="#22d3ee" stroke-width="1"/>
  <text x="870" y="358" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" text-anchor="middle">TOUCH + DESKTOP</text>
</svg>
