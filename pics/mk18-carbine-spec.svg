<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <rect width="800" height="350" fill="#040812"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(34, 211, 238, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="350" fill="url(#grid)"/>

  <text x="40" y="45" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#22d3ee" letter-spacing="2">
    ❖ MK-18 COMPOSITE CARBINE // TECHNICAL BLUEPRINT
  </text>
  <text x="40" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
    CALIBER: 6.8MM AP CASELESS · 520 RPM · 3-AXIS SPRING RECOIL
  </text>

  <!-- Gun Schematic Silhouette -->
  <!-- Stock -->
  <rect x="80" y="150" width="100" height="40" rx="4" fill="#18202c" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="80" y="190" width="30" height="35" rx="3" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>

  <!-- Receiver -->
  <rect x="180" y="140" width="180" height="60" rx="4" fill="#1f293d" stroke="#22d3ee" stroke-width="1.5"/>
  
  <!-- Magazine (P-Mag) -->
  <polygon points="260,200 300,200 280,280 240,280" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b" text-anchor="middle">30 RND</text>

  <!-- Picatinny Top Rail -->
  <rect x="180" y="125" width="260" height="15" fill="#0b1118" stroke="#22d3ee" stroke-width="1"/>
  <line x1="200" y1="125" x2="200" y2="140" stroke="#22d3ee" stroke-width="1"/>
  <line x1="220" y1="125" x2="220" y2="140" stroke="#22d3ee" stroke-width="1"/>
  <line x1="240" y1="125" x2="240" y2="140" stroke="#22d3ee" stroke-width="1"/>

  <!-- Holo Sight -->
  <polygon points="230,125 290,125 285,85 240,85" fill="#090e17" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="260" cy="105" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="260" cy="105" r="2" fill="#ef4444"/>

  <!-- Handguard M-LOK -->
  <rect x="360" y="145" width="160" height="45" rx="3" fill="#18202c" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="380" y="155" width="30" height="8" rx="2" fill="#030712" stroke="#22d3ee" stroke-width="0.8"/>
  <rect x="425" y="155" width="30" height="8" rx="2" fill="#030712" stroke="#22d3ee" stroke-width="0.8"/>
  <rect x="470" y="155" width="30" height="8" rx="2" fill="#030712" stroke="#22d3ee" stroke-width="0.8"/>

  <!-- Barrel & Flash Hider -->
  <rect x="520" y="155" width="120" height="20" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <polygon points="640,150 670,155 670,175 640,180" fill="#050912" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Annotations & Callouts -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="85" x2="260" y2="60"/>
    <line x1="260" y1="60" x2="160" y2="60"/>

    <line x1="440" y1="145" x2="440" y2="100"/>
    <line x1="440" y1="100" x2="520" y2="100"/>

    <line x1="660" y1="150" x2="660" y2="110"/>
    <line x1="660" y1="110" x2="720" y2="110"/>

    <line x1="260" y1="280" x2="260" y2="305"/>
    <line x1="260" y1="305" x2="350" y2="305"/>
  </g>

  <text x="150" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee" text-anchor="end">OPTICAL HOLO-SIGHT (48° ADS)</text>
  <text x="530" y="104" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">M-LOK HEAT SHIELD</text>
  <text x="725" y="114" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22d3ee">BIRDCAGE FLASH HIDER</text>
  <text x="360" y="309" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f59e0b">CURVED HIGH-CAP P-MAG</text>
</svg>
